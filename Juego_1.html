<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chanchito Aventura: Mundos Animados</title>
  <link rel="icon" href="img/logo_vaulty+.png" type="image/png">
  <link rel="stylesheet" href="Juego_1.css" />
</head>
<body>
  <main id="appShell">
    <header id="topBar">
      <div>
        <p class="eyebrow">Aventura Deluxe</p>
        <h1>Chanchito Aventura</h1>
      </div>
      <div id="quickStats" aria-hidden="true">
        <span>10 mundos</span>
        <span>enemigos nuevos</span>
        <span>doble salto</span>
      </div>
    </header>

    <section id="frame">
      <div id="gameContainer">
        <canvas id="game" width="900" height="480"></canvas>

        <div id="hud">
          <div class="hud-pill level-pill">
            <span>Nivel</span>
            <b id="levelCount">1 / 10</b>
          </div>
          <div class="hud-pill">
            <span>Monedas</span>
            <b><span id="coinCount">0</span>/<span id="coinTotal">0</span></b>
          </div>
          <div class="hud-pill">
            <span>Puntos</span>
            <b id="scoreCount">0</b>
          </div>
          <div class="hud-pill">
            <span>Vidas</span>
            <b id="livesIcons">&hearts;&hearts;&hearts;</b>
          </div>
          <div class="hud-pill power-pill">
            <span>Poder</span>
            <b id="powerText">listo</b>
          </div>
        </div>

        <button id="pauseBtn" class="icon-button" type="button" aria-label="Pausar juego" title="Pausar (P o Esc)">
          &#10074;&#10074;
        </button>

        <div id="levelBanner">
          NIVEL 1
          <small>Valle Dulce</small>
        </div>

        <div id="message">
          <div id="messageCard">
            <h2 id="msgTitle"></h2>
            <p id="msgText"></p>
            <p id="msgText2"></p>
            <div id="levelPicker" class="level-picker" hidden></div>
            <div class="message-actions">
              <button onclick="onMessageButton()" id="msgBtn">Comenzar</button>
              <button onclick="onSecondaryButton()" id="msgSecondaryBtn" class="secondary-button" hidden>Elegir nivel</button>
            </div>
          </div>
        </div>

        <div id="mobileControls" aria-hidden="true">
          <button id="leftBtn">&#9664;</button>
          <button id="jumpBtn">&#9650;</button>
          <button id="rightBtn">&#9654;</button>
        </div>
      </div>
    </section>

    <div id="levelDots"></div>

    <p id="instructions">
      <b>&larr; &rarr; / A D</b> moverse · <b>Espacio / &uarr; / W</b> doble salto ·
      pisa enemigos · toma la <b>estrella</b> para brillar · llega a la bandera · <b>P / Esc</b> pausa.
    </p>
  </main>

  <script src="Juego_1.js"></script>
</body>
</html>
